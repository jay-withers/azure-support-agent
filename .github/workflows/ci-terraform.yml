name: ci-terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init and validate via the shared workflow. The path filter
  # and the always-reporting gate job both live in there — mark
  # "terraform / Terraform" as the required check in the ruleset, not the bare
  # job id.
  #
  # There is no plan job: the root config resolves the shared Container Apps
  # environment through a data source, so a plan needs real Azure credentials
  # and an applied platform. Plans are run by an operator with `make plan`.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    # TODO: re-pin to the released tag's SHA once jay-withers/workflows has cut
    # a release containing the validate-only terraform.yml.
    uses: jay-withers/workflows/.github/workflows/terraform.yml@fb1c41960759020f9425e1351bf3cd893143d657 # main
    with:
      directories: '["terraform"]'
